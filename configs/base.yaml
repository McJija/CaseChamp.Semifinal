# Базовые настройки. Конфиги запусков наследуют их через `_base_: base.yaml` и переопределяют отдельные поля.
# Пути — относительно каталога запуска; в Kaggle переопределяются аргументами скриптов.
data:
  data_root: mrt                      # исходные снимки (только чтение)
  processed_dir: data/processed       # pool.csv, splits.csv и служебные таблицы
  cache_dir: data/processed/cache     # кэш препроцессинга (python -m src.build_pool)
  size: 256
  batch_size: 32
  num_workers: 2
  domain_randomization: true          # аугментации против shortcut; false — только базовые
  seed: 42                            # в обучении заменяется на train.seed (порядок батчей и аугментации)

model:
  encoder: resnet34                   # один и тот же у классификатора, сегментатора и многозадачной сети
  pretrained: true                    # веса ImageNet
  dropout: 0.2                        # перед классификационной головой многозадачной сети

train:
  seed: 42                            # seed обучения; деление данных от него не зависит (оно в pool.csv)
  epochs: 20
  epochs_frozen: 3                    # фаза 1: энкодер заморожен, учатся только головы
  lr_head: 3.0e-4
  lr_encoder: 3.0e-5                  # фаза 2: энкодер учится в 10 раз медленнее голов
  weight_decay: 0.01
  warmup_epochs: 1
  label_smoothing: 0.0
  class_weights: true
  cls_loss_weight: 1.0                # вес классификационной ошибки в многозадачной сети
  amp: true                           # смешанная точность на видеокарте
  seg_crop:                           # запасной вариант обучения сегментатора (шаг 5.2); включать только по порогу ложных масок
    enabled: false
    size: 128                         # фрагмент без изменения масштаба
    empty_fraction: 0.3               # доля фрагментов без опухоли
  seg_negatives:                      # сегментатор: настоящие снимки «нет опухоли» из train с пустой маской (против ложных обводок)
    enabled: false
  counterfactual:                     # контрфактические примеры (src/counterfactual.py; эксперимент: научить классификатор смотреть на опухоль)
    enabled: false
    p_remove: 0.3                     # доля снимков с маской: опухоль закрашена, метка «нет опухоли»
    p_control: 0.3                    # доля снимков: закрашен участок вне опухоли, метка прежняя
    dilate_px: [2, 10]                # случайное расширение маски перед закрашиванием

eval:
  recall_floor: 0.95                  # выбор эпохи классификатора: recall «опухоль есть» не ниже
  dice_tolerance: 0.02                # выбор эпохи многозадачной сети: Dice не хуже лучшего более чем на
  mask_threshold: 0.5
  min_mask_area_px: 50                # «маска найдена», если площадь больше; рабочее значение для контроля обучения
                                      # (самая мелкая настоящая маска — 76 px), итоговый порог подбирается на val на шаге 5.5
