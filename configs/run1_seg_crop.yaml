# Шаг 5.2, запасной вариант сегментатора: обучение на фрагментах 128×128 без изменения масштаба,
# часть фрагментов без опухоли; предсказание на полном снимке. Запускается, потому что у базового
# run1_seg ложная маска на 40–43 из 56 снимков «нет опухоли» (порог 10%). Сравнение с run1_seg — на seed 42, 43, 44.
_base_: base.yaml
run: run1_seg_crop
kind: segmenter
train:
  epochs: 40
  epochs_frozen: 5
  seg_crop:
    enabled: true
