# Шаг 5.2, сегментатор с контрфактическими примерами: срез с закрашенной опухолью получает пустую маску,
# срез с закрашенным участком вне опухоли — прежнюю. Цель — отучить рисовать маску там, где опухоли нет.
# Единственное отличие от run1_seg; сравнение на seed 42, 43, 44.
_base_: base.yaml
run: run1_seg_cf
kind: segmenter
train:
  epochs: 40
  epochs_frozen: 5
  counterfactual:
    enabled: true
