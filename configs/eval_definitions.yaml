# Определения проверок против shortcut (шаг 6.5). Зафиксированы 7 октября 2026 г., до обучения моделей.
# Менять после просмотра результатов запуска 1 нельзя. Преобразования реализованы в src/stress.py;
# числовые параметры подобраны только по обучающей части (python -m src.stress --calibrate).

decision:
  # «Опухоль есть», если предсказан любой класс, кроме «нет опухоли» (правило argmax).
  # В сравнении схем (запуск 1 против 2) и вариантов обучения (5.3) используется только это правило —
  # без подбора порога под каждую модель. Порог из шага 6.1 применяется лишь в финальной оценке.
  rule: argmax
  p_tumor: "1 - p(no_tumor)"

stress_test:
  # Снимок приводится к техническому профилю файлов другого класса и снова подается в модель
  # через обычный препроцессинг. Профили измерены по исходным файлам обучающей части пула.
  tumor_to_no_tumor_profile:        # опухоли → «маленький резкий сжатый файл»
    long_side: 251                  # медиана длинной стороны файлов «нет опухоли» (train)
    resize: area
    unsharp_sigma: 1.0
    unsharp_amount: 1.0             # подобрано: резкость после преобразования ≈ резкость файлов «нет опухоли»
    jpeg_quality: 90                # подобрано: байт на пиксель ≈ как у файлов «нет опухоли»
  no_tumor_to_tumor_profile:        # «нет опухоли» → «большой мягкий файл без повторного сжатия»
    long_side: 512
    resize: cubic
    blur_sigma: 1.0                 # подобрано: резкость после преобразования ≈ резкость файлов опухолей
  applies_to: val                   # опухоли val — первое преобразование, «нет опухоли» val — второе; test — один раз при финальной оценке
  measures:
    - flip_rate_tumor               # доля опухолей, у которых ответ сменился на «нет опухоли»
    - flip_rate_no_tumor            # доля «нет опухоли», у которых ответ сменился на «опухоль»
    - mean_delta_p_tumor            # среднее изменение p_tumor в каждой группе
  primary: balanced_flip_rate       # среднее двух долей (чтобы 56 снимков «нет опухоли» не терялись на фоне 469 опухолей); меньше — лучше

gradcam_hit:
  layer: last_encoder_block         # resnet34: layer4; efficientnet_b0: последний блок перед головой
  target: true_class                # карта строится для истинного класса опухоли
  upsample: bilinear_to_256
  hit: argmax_inside_dilated_mask   # максимум карты лежит внутри маски, расширенной на dilate_px
  dilate_px: 16                     # половина ячейки карты 8×8
  applies_to: val_with_masks        # 391 снимок; test — один раз при финальной оценке
  primary: hit_rate                 # больше — лучше

occlusion:
  # Закрашивание опухоли: область опухоли заполняется по окружающим тканям, снимок снова подается в модель.
  space: model_256                  # в координатах модели, после препроцессинга
  region: mask_dilated
  dilate_px: 4
  fill: inpaint_telea               # cv2.inpaint, заполнение по окружению
  inpaint_radius: 5
  control:
    # Контроль: закрасить такой же по форме участок вне опухоли.
    candidates: [mirror_horizontal, mirror_vertical, rotate_180]   # относительно центра рамки головы; берется первый подходящий
    no_overlap_dilate_px: 8         # участок не пересекает маску, расширенную на столько пикселей
    min_tissue_fraction: 0.8        # не менее этой доли участка лежит на ткани (яркость > tissue_threshold)
    tissue_threshold: 20
    if_none: exclude_from_paired    # снимок без подходящего участка не входит в парное сравнение; их число приводится
  applies_to: val_with_masks        # считается по снимкам, где исходный ответ — «опухоль»
  measures:
    - flip_rate                     # доля снимков, где ответ сменился с «опухоль» на «нет опухоли» (опухоль закрашена)
    - flip_rate_control             # то же при закрашенном контрольном участке
    - mean_drop_p_tumor             # среднее падение p_tumor (опухоль закрашена)
    - mean_drop_p_tumor_control
  primary: flip_rate_minus_control  # разница долей на парной выборке; больше — лучше (ответ зависит именно от опухоли)

uncertainty:
  bootstrap_unit: group             # колонка group в pool.csv: пациент или группа снимков
  n_boot: 2000
  seed: 42
  interval: 0.95
