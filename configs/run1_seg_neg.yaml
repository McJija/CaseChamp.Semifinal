# Шаг 5.2, сегментатор с настоящими снимками без опухоли: к срезам с маской добавлены снимки «нет опухоли»
# из train (246) с пустой маской. Цель — убрать ложные маски: фрагменты и закрашивание их не уменьшили,
# потому что ложные маски возникают на снимках другого вида, а таких в обучении не было.
# Контроль против «чужой источник → пустая маска» — доля опухолей из `other` с найденной областью.
# Единственное отличие от run1_seg; сравнение на seed 42, 43, 44.
_base_: base.yaml
run: run1_seg_neg
kind: segmenter
train:
  epochs: 40
  epochs_frozen: 5
  seg_negatives:
    enabled: true
